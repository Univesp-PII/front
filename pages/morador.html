<div class="page-header mb-4">
  <h2><i class="bi bi-house-add mr-2"></i>Cadastrar Morador</h2>
  <small class="text-muted">Cadastro de moradores do condomínio</small>
</div>

<div class="card form-card">
  <div class="card-body">
    <form data-form-name="morador">
      <div class="row">
        <div class="col-md-6 form-group">
          <label for="nomeMorador">Nome</label>
          <input type="text" class="form-control" id="nomeMorador" name="nomeMorador" placeholder="Nome completo" required />
        </div>
        <div class="col-md-6 form-group">
          <label for="blocoMorador">Torre / Bloco</label>
          <input type="text" class="form-control" id="blocoMorador" name="blocoMorador" placeholder="Ex: Torre A" required />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 form-group">
          <label for="apartamento">Apartamento</label>
          <input type="text" class="form-control" id="apartamento" name="apartamento" placeholder="Ex: 203" required />
        </div>
        <div class="col-md-6 form-group">
          <label for="telefoneMorador">Telefone (WhatsApp)</label>
          <input type="tel" class="form-control" id="telefoneMorador" name="telefoneMorador" placeholder="(00) 00000-0000" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-3">Cadastrar morador</button>
    </form>
  </div>
</div>
