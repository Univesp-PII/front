<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <title>Receba | Dashboard</title>
</head>

<body class="has-sidebar">
  <nav class="navbar navbar-expand-md navbar-dark fixed-top">
    <a class="navbar-brand" href="#">
      <i class="bi bi-box-seam mr-2"></i><strong>Receba</strong>
    </a>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <span class="navbar-text text-white mr-3">
          <i class="bi bi-person-circle mr-2"></i><span id="currentUser">Usuário</span>
        </span>
      </li>
      <li class="nav-item">
        <button id="logoutButton" class="nav-link btn btn-link text-white" type="button">
          <i class="bi bi-box-arrow-right mr-1"></i>Sair
        </button>
      </li>
    </ul>
  </nav>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h5>Menu</h5>
    </div>

    <div class="sidebar-menu">
      <button type="button" class="sidebar-link active" data-view="dashboard">
        <i class="bi bi-speedometer2 mr-2"></i>Dashboard
      </button>
      <button type="button" class="sidebar-link" data-view="encomenda">
        <i class="bi bi-box-seam mr-2"></i>Registrar Encomenda
      </button>
      <button type="button" class="sidebar-link" data-view="morador">
        <i class="bi bi-house-add mr-2"></i>Cadastrar Morador
      </button>
      <button type="button" class="sidebar-link" data-view="porteiro">
        <i class="bi bi-person-badge mr-2"></i>Cadastrar Porteiro
      </button>
      <button type="button" class="sidebar-link" data-view="historico">
        <i class="bi bi-clock-history mr-2"></i>Histórico
      </button>
    </div>
  </aside>

  <main class="dashboard-main">
    <div class="container-fluid">
      <div id="appContent" class="content-area"></div>
    </div>
  </main>
</body>

</html>
