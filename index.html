<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/login.css" />
    <script src="./scripts/app.js" defer></script>
    <script src="./scripts/login.js" defer></script>
    <script src="./scripts/toast.js" defer></script>
    <title>Receba | Login</title>
</head>

<body class="login-page">
    <div class="container login-container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm login-card">
                    <div class="text-center mb-4">
                        <img src="./assets/images/logo.png" alt="Receba" class="login-logo" />
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" autocomplete="username"
                                required />
                        </div>

                        <div class="form-group">
                            <label for="password">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password"
                                placeholder="Sua senha" required />
                        </div>

                        <button type="submit" class="btn btn-primary btn-block mt-3">
                            Entrar
                        </button>

                        <p id="loginMessage" class="mt-3 mb-0 small text-muted"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
